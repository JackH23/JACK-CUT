name: Deploy JACK-CUT staging frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jack-cut-staging-frontend
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://p01--jack-cut-staging--bqpgh5v9gs6m.code.run
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false

      - name: Validate branch and required secrets
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/staging"
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_STAGING_API_TOKEN secret"; exit 1; }
          grep -Eq '"name"[[:space:]]*:[[:space:]]*"jack-cut-staging"' wrangler.staging.jsonc
          test "${NEXT_PUBLIC_API_URL}" = "https://p01--jack-cut-staging--bqpgh5v9gs6m.code.run"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext staging bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy only the staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc
